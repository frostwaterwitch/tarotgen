<!DOCTYPE html>
<html>
<head>
<title>tarot engine</title>
<style>
body {
    font-family: Georgia, serif;
    text-align: center;
    background-color: #0e0e0f;
    color: #e8e6e3;
    margin: 0;
    padding: 50px;
}

h2 {
    font-weight: normal;
    letter-spacing: 1px;
}

input, select, button {
    padding: 8px 12px;
    margin: 8px;
    font-size: 16px;
}

button {
    cursor: pointer;
    background-color: #1f1f22;
    color: #e8e6e3;
    border: 1px solid #333;
}

button:hover {
    background-color: #2a2a2f;
}

#result {
    margin-top: 40px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.7;
    opacity: 0;
    transition: opacity 0.4s ease-in;
}

.card-title {
    font-size: 26px;
    margin-bottom: 5px;
}

.meta {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 25px;
    text-transform: lowercase;
}

.section-label {
    font-weight: bold;
    margin-top: 20px;
    display: block;
}

.divider {
    height: 1px;
    background-color: #222;
    margin: 25px 0;
}
</style>
</head>

<body>

<h2>tarot lookup</h2>

<input type="number" id="manualNumber" placeholder="enter 0–77" min="0" max="77">
<select id="orientationSelect">
    <option value="upright">upright</option>
    <option value="reversed">reversed</option>
</select>

<br>

<button onclick="manualLookup()">lookup</button>
<button onclick="randomDraw()">random draw</button>

<div id="result"></div>
<script src="deck.js"></script>

<script>
function displayCard(num, orientation) {
    const card = deck[num];

    if (!card) {
        document.getElementById("result").innerHTML = "card not found";
        return;
    }

    const meaning = card[orientation];

    const resultHTML = `
        <div class="card-title">${card.name}</div>
        <div class="meta">${orientation} • ${card.arcana} • ${card.element}</div>

        <div class="divider"></div>

        <span class="section-label">core theme</span>
        ${card.core.join(", ")}

        <span class="section-label">${orientation} keywords</span>
        ${meaning.keywords.join(", ")}

        <span class="section-label">shadow expression</span>
        ${meaning.shadow}

        <span class="section-label">growth edge</span>
        ${meaning.growth}

        <div style="margin-top:30px;">
            <button onclick="copyReading(${num}, '${orientation}')">
                copy for notion
            </button>
        </div>
    `;

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = resultHTML;
    resultDiv.style.opacity = 1;
}
    function copyReading(num, orientation) {
    const card = deck[num];
    const meaning = card[orientation];

    const text = `
${num} — ${card.name} (${orientation})

core: ${card.core.join(", ")}

${orientation} keywords: ${meaning.keywords.join(", ")}

shadow: ${meaning.shadow}

growth: ${meaning.growth}
    `.trim();

    navigator.clipboard.writeText(text);
}
</script>
</body>
</html>

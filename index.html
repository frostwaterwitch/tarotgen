<!DOCTYPE html>
<html>
<head>
<title>tarot engine</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #111;
    color: #e6e6e6;
    margin: 0;
    padding: 40px;
}

input, select, button {
    padding: 8px 12px;
    margin: 8px;
    font-size: 16px;
}

button {
    cursor: pointer;
}

#result {
    margin-top: 30px;
    font-size: 20px;
    line-height: 1.6;
}
</style>
</head>

<body>

<h2>tarot lookup</h2>

<input type="number" id="manualNumber" placeholder="enter 0–77" min="0" max="77">
<select id="orientationSelect">
    <option value="upright">upright</option>
    <option value="reversed">reversed</option>
</select>

<br>

<button onclick="manualLookup()">lookup</button>
<button onclick="randomDraw()">random draw</button>

<div id="result"></div>
<script src="deck.js"></script>

<script>
function displayCard(num, orientation) {
    const card = deck[num];

    if (!card) {
        document.getElementById("result").innerHTML = "card not found";
        return;
    }

    const meaning = card[orientation];

    document.getElementById("result").innerHTML =
        "<strong>" + card.name + "</strong><br>" +
        orientation + "<br><br>" +

        "<strong>core theme:</strong> " + card.core.join(", ") + "<br><br>" +

        "<strong>" + orientation + " keywords:</strong><br>" +
        meaning.keywords.join(", ") + "<br><br>" +

        "<strong>shadow expression:</strong><br>" +
        meaning.shadow + "<br><br>" +

        "<strong>growth edge:</strong><br>" +
        meaning.growth;
}


function manualLookup() {
    const num = parseInt(document.getElementById("manualNumber").value);
    const orientation = document.getElementById("orientationSelect").value;

    if (isNaN(num) || num < 0 || num > 77) {
        document.getElementById("result").innerHTML = "enter a number between 0 and 77";
        return;
    }

    displayCard(num, orientation);
}


function randomDraw() {
    const num = Math.floor(Math.random() * 78);
    const orientation = Math.random() < 0.5 ? "upright" : "reversed";

    document.getElementById("manualNumber").value = num;
    document.getElementById("orientationSelect").value = orientation;

    displayCard(num, orientation);
}

</script>

</body>
</html>

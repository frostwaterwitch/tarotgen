<!DOCTYPE html>
<html>
<head>
<title>tarot engine</title>

<style>
body {
    font-family: "Calibri", sans;
    background-color: #0b0b0d;
    color: #e6e2dc;
    padding: 60px 20px;
    margin: 0;
    display: flex;
    justify-content: center;
}

h2 {
    font-weight: normal;
    letter-spacing: 1px;
    opacity: 0.85;
}

input, select {
    padding: 8px 12px;
    margin: 8px;
    font-size: 15px;
    background-color: #151518;
    color: #e6e2dc;
    border: 1px solid #2a2a30;
}

button {
    padding: 8px 14px;
    margin: 8px;
    font-size: 15px;
    cursor: pointer;
    background-color: #18181c;
    color: #d4c8a3;
    border: 1px solid #2a2a30;
    transition: all 0.2s ease;
}

button:hover {
    background-color: #202025;
    border-color: #3a3a45;
}

#result {
    margin-top: 50px;
    max-width: 650px;
    margin-left: auto;
    margin-right: auto;
    background-color: #111114;
    padding: 40px;
    border: 1px solid #1f1f25;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    line-height: 1.7;
}

.card-title {
    font-size: 28px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
}

.meta {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 25px;
    text-transform: lowercase;
}

.section-label {
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.6;
    display: block;
    margin-top: 22px;
}

.divider {
    height: 1px;
    background-color: #1e1e24;
    margin: 30px 0;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">
<h2>tarot lookup</h2>

<input type="number" id="cardNumber" placeholder="0–77" min="0" max="77">
<select id="orientation">
    <option value="upright">upright</option>
    <option value="reversed">reversed</option>
</select>

<br>

<button onclick="lookupCard()">lookup</button>
<button onclick="randomCard()">random</button>

<div id="result"></div>

<script src="deck.js"></script>

<script>

function lookupCard() {
    const num = parseInt(document.getElementById("cardNumber").value);
    const orientation = document.getElementById("orientation").value;

    if (isNaN(num) || num < 0 || num > 77) {
        document.getElementById("result").innerHTML = "enter a number 0–77";
        return;
    }

    displayCard(num, orientation);
}

function randomCard() {
    const num = Math.floor(Math.random() * 78);
    const orientation = Math.random() < 0.5 ? "upright" : "reversed";

    document.getElementById("cardNumber").value = num;
    document.getElementById("orientation").value = orientation;

    displayCard(num, orientation);
}

function displayCard(num, orientation) {

    const card = deck.find(c => c.num === num);

    if (!card) {
        document.getElementById("result").innerHTML = "card not found";
        return;
    }

    const keywords = orientation === "upright"
        ? card["upright keywords"]
        : card["reversed keywords"];

    document.getElementById("result").innerHTML = `
    <div class="card-title">${card["card title"]}</div>
    <div class="meta">${orientation} • ${card.arcana} • ${card.element}</div>

    <div class="divider"></div>

    <span class="section-label">core theme</span>
    ${card["core themes"]}

    <span class="section-label">${orientation} keywords</span>
    ${keywords}

    <span class="section-label">shadow expression</span>
    ${card["shadow expression"]}

    <span class="section-label">growth edge</span>
    ${card["growth edge"]}

    <div style="margin-top:30px;">
        <button onclick="copyReading(${num}, '${orientation}')">
            copy for notion
        </button>
    </div>
`;
}

</script>
</div>
</body>
</html>

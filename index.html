<!DOCTYPE html>
<html>
<head>
<title>tarot engine</title>

<style>
body {
    font-family: Georgia, serif;
    text-align: center;
    background-color: #0e0e0f;
    color: #e8e6e3;
    padding: 50px;
}

input, select, button {
    padding: 8px 12px;
    margin: 8px;
    font-size: 16px;
}

#result {
    margin-top: 40px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
}
</style>
</head>

<body>

<h2>tarot lookup</h2>

<input type="number" id="cardNumber" placeholder="0–77" min="0" max="77">
<select id="orientation">
    <option value="upright">upright</option>
    <option value="reversed">reversed</option>
</select>

<br>

<button onclick="lookupCard()">lookup</button>
<button onclick="randomCard()">random</button>

<div id="result"></div>

<script src="deck.js"></script>

<script>

function lookupCard() {
    const num = parseInt(document.getElementById("cardNumber").value);
    const orientation = document.getElementById("orientation").value;

    if (isNaN(num) || num < 0 || num > 77) {
        document.getElementById("result").innerHTML = "enter a number 0–77";
        return;
    }

    displayCard(num, orientation);
}

function randomCard() {
    const num = Math.floor(Math.random() * 78);
    const orientation = Math.random() < 0.5 ? "upright" : "reversed";

    document.getElementById("cardNumber").value = num;
    document.getElementById("orientation").value = orientation;

    displayCard(num, orientation);
}

function displayCard(num, orientation) {

    const card = deck.find(c => c.num === num);

    if (!card) {
        document.getElementById("result").innerHTML = "card not found";
        return;
    }

    const keywords = orientation === "upright"
        ? card["upright keywords"]
        : card["reversed keywords"];

    document.getElementById("result").innerHTML = `
        <strong>${card["card title"]}</strong><br>
        ${orientation}<br><br>

        <strong>core theme:</strong><br>
        ${card["core themes"]}<br><br>

        <strong>${orientation} keywords:</strong><br>
        ${keywords}<br><br>

        <strong>shadow expression:</strong><br>
        ${card["shadow expression"]}<br><br>

        <strong>growth edge:</strong><br>
        ${card["growth edge"]}
    `;
}

</script>

</body>
</html>

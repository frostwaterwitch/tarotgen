<!DOCTYPE html>
<html>
<head>
<title>tarot engine</title>

<style>
/* Webkit Browsers (Firefox) */
* {
    scrollbar-width: thin;
    scrollbar-color: #1e222a #0b0b0d;
}

/* Webkit Browsers (Chrome, Edge, Safari) */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #0b0b0d;
}

::-webkit-scrollbar-thumb {
    background: rgba(191,196,204,0.15);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #2c313a;
}

:root {
    --silver: #bfc4cc;
    --silver-soft: #8f949c;
    --silver-glow: rgba(191,196,204,0.15);
}
    
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Calibri", sans;
    background-color: #0b0b0d;
    color: #e6e2dc;
    padding: 30px 20px;
    margin: 0;
    display: flex;
    justify-content: center;
}

h2 {
    font-weight: normal;
    letter-spacing: 1px;
    opacity: 0.85;
}

input, select {
    padding: 6px 10px;
    font-size: 14px;
    margin: 6px;
    background-color: #151518;
    color: #e6e2dc;
    border: 1px solid #2a2a30;
}

button {
    padding: 6px 12px;
    font-size: 14px;
    margin: 6px;
    cursor: pointer;
    background-color: #18181c;
    color: var(--silver);
    border: 1px solid #2a2f38;
    transition: all 0.2s ease;
    min-width: 130px;
}

button:hover {
    background-color: #20242c;
    border-color: var(--silver-soft);
}

#result {
    margin-top: 30px;
    padding: 28px;
    max-height: 28vh;
    max-width: 650px;
    margin-left: auto;
    margin-right: auto;
    background-color: #111114;
    border: 1px solid #1c1f26;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6),
                0 0 20px var(--silver-glow);
    line-height: 1.7;
    overflow-y: auto;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

.card-title {
    font-size: 24px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    color: var(--silver);
}

.meta {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 25px;
    text-transform: lowercase;
}

.section-label {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--silver-soft);
    display: block;
    margin-top: 22px;
}

.divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--silver-glow), transparent);
    margin: 30px 0;
}

.container {
    width: 650px;
    max-width: 90%;
    margin: 0 auto;
    text-align: center;
}

#copyNotice {
    margin-top: 15px;
    font-size: 13px;
    color: var(--silver);
    opacity: 0;
    transition: opacity 0.4s ease;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">
<h2>tarot lookup</h2>

<input type="number" id="cardNumber" placeholder="0–77" min="0" max="77">
<select id="orientation">
    <option value="upright">upright</option>
    <option value="reversed">reversed</option>
</select>

<br>

<button onclick="lookupCard()">lookup</button>
<button onclick="randomCard()">random</button>

<div id="result"></div>
    <div id="copyNotice"></div>

<script src="deck.js"></script>

<script>

function lookupCard() {
    const num = parseInt(document.getElementById("cardNumber").value);
    const orientation = document.getElementById("orientation").value;

    if (isNaN(num) || num < 0 || num > 77) {
        document.getElementById("result").innerHTML = "enter a number 0–77";
        return;
    }

    displayCard(num, orientation);
}

function randomCard() {
    const num = Math.floor(Math.random() * 78);
    const orientation = Math.random() < 0.5 ? "upright" : "reversed";

    document.getElementById("cardNumber").value = num;
    document.getElementById("orientation").value = orientation;

    displayCard(num, orientation);
}

function displayCard(num, orientation) {

    const card = deck.find(c => c.num === num);

    if (!card) {
        document.getElementById("result").innerHTML = "card not found";
        return;
    }

    const keywords = orientation === "upright"
        ? card["upright keywords"]
        : card["reversed keywords"];

    document.getElementById("result").innerHTML = `
    <div class="card-title">${card["card title"]}</div>
    <div class="meta">${orientation} • ${card.arcana} • ${card.element}</div>

    <div class="divider"></div>

    <span class="section-label">core theme</span>
    ${card["core themes"]}

    <span class="section-label">${orientation} keywords</span>
    ${keywords}

    <span class="section-label">shadow expression</span>
    ${card["shadow expression"]}

    <span class="section-label">growth edge</span>
    ${card["growth edge"]}

    <div style="margin-top:30px;">
        <button onclick="copyReading(${num}, '${orientation}')">
            copy for notion
        </button>
    </div>
`;
}
async function copyReading(num, orientation) {

    const card = deck.find(c => c.num === num);
    if (!card) return;

    const keywords = orientation === "upright"
        ? card["upright keywords"]
        : card["reversed keywords"];

    const text =
`${num} — ${card["card title"]} (${orientation})

core: ${card["core themes"]}

${orientation} keywords: ${keywords}

shadow: ${card["shadow expression"]}

growth: ${card["growth edge"]}`;

    try {
        await navigator.clipboard.writeText(text);
        showCopyNotice();
    } catch (err) {
        fallbackCopy(text);
        showCopyNotice();
    }
}
function showCopyNotice() {
    const notice = document.getElementById("copyNotice");
    notice.textContent = "copied";
    notice.style.opacity = 1;

    setTimeout(() => {
        notice.style.opacity = 0;
    }, 1800);
}

</script>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>tarot engine</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #111;
    color: #e6e6e6;
    margin: 0;
    padding: 40px;
}

input, select, button {
    padding: 8px 12px;
    margin: 8px;
    font-size: 16px;
}

button {
    cursor: pointer;
}

#result {
    margin-top: 30px;
    font-size: 20px;
    line-height: 1.6;
}
</style>
</head>

<body>

<h2>tarot lookup</h2>

<input type="number" id="manualNumber" placeholder="enter 0–77" min="0" max="77">
<select id="orientationSelect">
    <option value="upright">upright</option>
    <option value="reversed">reversed</option>
</select>

<br>

<button onclick="manualLookup()">lookup</button>
<button onclick="randomDraw()">random draw</button>

<div id="result"></div>

<script>

const majors = [
"the fool","the magician","the high priestess","the empress","the emperor","the hierophant",
"the lovers","the chariot","strength","the hermit","wheel of fortune","justice",
"the hanged man","death","temperance","the devil","the tower","the star",
"the moon","the sun","judgement","the world"
];

const suits = ["wands","cups","swords","pentacles"];
const ranks = ["ace","two","three","four","five","six","seven","eight","nine","ten","page","knight","queen","king"];

function getCardName(num) {
    if (num <= 21) {
        return majors[num];
    }

    let index = num - 22;
    let suitIndex = Math.floor(index / 14);
    let rankIndex = index % 14;

    return ranks[rankIndex] + " of " + suits[suitIndex];
}

function getMeaning(name, orientation) {
    return orientation === "upright"
        ? name + " upright meaning placeholder"
        : name + " reversed meaning placeholder";
}

function manualLookup() {
    const num = parseInt(document.getElementById("manualNumber").value);
    const orientation = document.getElementById("orientationSelect").value;

    if (isNaN(num) || num < 0 || num > 77) {
        document.getElementById("result").innerHTML = "enter a number between 0 and 77";
        return;
    }

    const cardName = getCardName(num);
    const meaning = getMeaning(cardName, orientation);

    document.getElementById("result").innerHTML =
        "<strong>" + cardName + "</strong><br>" +
        orientation + "<br><br>" +
        meaning;
}

function randomDraw() {
    const num = Math.floor(Math.random() * 78);
    const orientation = Math.random() < 0.5 ? "upright" : "reversed";

    document.getElementById("manualNumber").value = num;
    document.getElementById("orientationSelect").value = orientation;

    const cardName = getCardName(num);
    const meaning = getMeaning(cardName, orientation);

    document.getElementById("result").innerHTML =
        "<strong>" + cardName + "</strong><br>" +
        orientation + "<br><br>" +
        meaning;
}

</script>

</body>
</html>
